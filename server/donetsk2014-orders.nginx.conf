# Add these locations inside the ivengo.munister.com.ua TLS server block.
location = /donetsk-orders/healthz {
    proxy_pass http://127.0.0.1:5081/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /donetsk-orders/api/ {
    rewrite ^/donetsk-orders/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:5081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}
